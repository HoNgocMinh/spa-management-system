{% extends 'layout/base.html' %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 400px;">
        <h2 class="text-center text-success mb-4">ĐĂNG NHẬP</h2>
        <form method="post" action="/login">
            <div class="form-floating mb-3 mt-3">
              <input type="text" class="form-control" id="username" placeholder="Tên đăng nhập" name="username" />
              <label for="username">Tên đăng nhập</label>
            </div>
             <div class="form-floating mb-3 mt-3">
              <input type="password" class="form-control" id="password" placeholder="Mật khẩu" name="password" />
              <label for="password">Mật khẩu</label>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
                <button type="submit" class="btn btn-success">Đăng nhập</button>
                <a href="/forgot-password" class="text-decoration-none small text-muted">Quên mật khẩu?</a>
            </div>
        </form>
        <hr class="my-4">
        <div class="text-center small">
            Chưa có tài khoản?
            <a href="/register" class="text-success fw-bold text-decoration-none">Đăng ký ngay</a>
        </div>
    </div>
</div>

{% endblock %}
